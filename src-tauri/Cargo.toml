[package]
name = "zapret-unified"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-open", "dialog-open", "clipboard-read-text", "clipboard-write-text", "protocol-asset", "window-all", "system-tray", "icon-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
reqwest = { version = "0.11", features = ["json"] }
zip = "0.6"
chrono = "0.4"
base64 = "0.21"
urlencoding = "2"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
custom-protocol = ["tauri/custom-protocol"]
